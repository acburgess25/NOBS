name: TestFlight Upload

# Upload a locally staged IPA from the Mac runner (no xcodebuild in CI).
# Stage first: bash scripts/stage-testflight-ipa.sh
# Default path: ~/nobs-build/NOBS.ipa

on:
  workflow_dispatch:

jobs:
  upload:
    name: Upload staged IPA
    runs-on: [self-hosted, macOS, ARM64, testflight]

    steps:
      - name: Install App Store Connect API key
        env:
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/private_keys
          key=~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8
          if printf '%s' "$ASC_API_KEY_CONTENT" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s' "$ASC_API_KEY_CONTENT" > "$key"
          else
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "$key"
          fi

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          ipa="$HOME/nobs-build/NOBS.ipa"
          test -f "$ipa"
          xcrun altool --upload-app \
            --type ios \
            --file "$ipa" \
            --apiKey ${{ secrets.ASC_API_KEY_ID }} \
            --apiIssuer ${{ secrets.ASC_API_ISSUER_ID }}

      - name: Clean up API key
        if: always()
        run: rm -f ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8
