name: Website check

# Build the Vite site on a GitHub-hosted runner for every pull request and
# for every push to main. This workflow does not deploy. Publishing stays in
# deploy-website.yml, which runs only when website files land on main.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install and build
        working-directory: website
        run: |
          pnpm install --frozen-lockfile
          pnpm build
