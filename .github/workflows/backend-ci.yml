name: Backend CI

# What runs where, and why:
#
# `backend` is the check that gates a pull request. It runs the portable
# Python suite (`scripts/dev.py setup`, then `scripts/dev.py check`) on
# GitHub-hosted ubuntu-latest with Python 3.12. Hosted runners are free for
# this public repository.
#
# That job used to target the self-hosted Mac ([self-hosted, macOS, ARM64]).
# The Mac was wiped, so nothing has those labels anymore. A job aimed at a
# missing self-hosted runner does not fail fast: it sits in the queue
# (runner_id 0, no steps) until it is cancelled, and the pull request can
# never go green.
#
# An earlier move onto ubuntu-latest was reverted in August 2026 because every
# hosted job died in about two seconds with runner_id 0 and no logs. That is
# an account-level Actions hold, not a test failure. This workflow is also
# the test of whether that hold is gone. A real run has a nonzero runner_id
# and a log of steps. See docs/CI_TROUBLESHOOTING.md.
#
# `cross-platform` (Python 3.12 on Linux, macOS, and Windows, plus Python 3.11
# on Linux) stays on manual dispatch. If hosted runners cannot be scheduled,
# those extra jobs would put a red X on every pull request that no code change
# can clear. Linux on Python 3.12 is already covered by `backend` on every
# pull request.
#
# `ios-macos` still needs the house Mac. NOBSTests uses the Xcode 27 beta
# toolchain, which GitHub's macOS images do not have. The job runs only when
# the repository variable MAC_RUNNER_ONLINE is exactly `true`. Until then it
# is skipped on pull requests, on pushes to main, and on manual dispatch, so
# it cannot sit in the queue. The TestFlight workflow uses the same gate.
# Re-register the runner with scripts/setup-github-runner-mac.sh, then set
# that variable, to turn the Mac jobs back on.
#
# Manual fallback for the Python suite: Actions → Backend CI → Run workflow,
# and set runner to self-hosted-mac. Do that only when the Mac runner is
# Idle. Otherwise that one run waits in the queue.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runner:
        description: Where to run tests and lint. Choose self-hosted-mac only when that runner is Idle.
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - self-hosted-mac

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Tests and lint
    runs-on: ${{ inputs.runner == 'self-hosted-mac' && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        if: runner.os != 'macOS'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve Python on the Mac
        if: runner.os == 'macOS'
        run: |
          for candidate in \
            /opt/homebrew/bin/python3.13 \
            /opt/homebrew/bin/python3.12 \
            /opt/homebrew/bin/python3.11 \
            /opt/homebrew/bin/python3 \
            python3
          do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "Using $candidate"
              echo "PYTHON=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No Python 3.11+ interpreter found on the Mac runner." >&2
          exit 1

      - name: Set up NOBS
        run: "${PYTHON:-python} scripts/dev.py setup"

      - name: Test and lint
        run: "${PYTHON:-python} scripts/dev.py check"

  cross-platform:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    # Manual only. An unschedulable hosted job would otherwise post a red X on
    # every pull request that no code change can clear. See the note at the top.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
        include:
          # Guard the supported floor without tripling the whole matrix.
          - os: ubuntu-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up NOBS
        run: python scripts/dev.py setup

      - name: Test and lint
        run: python scripts/dev.py check

  ios-macos:
    name: NOBSTests on Mac runner
    # Skipped unless the house Mac is registered again. A missing self-hosted
    # runner queues forever (runner_id 0, no steps) instead of failing, which
    # is what stalled pull requests after the Mac wipe. The same condition
    # applies on pushes to main and on manual dispatch, not only on pull
    # requests: there is no runner to pick the job up until the variable is set.
    if: vars.MAC_RUNNER_ONLINE == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45

    env:
      DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer

    steps:
      - uses: actions/checkout@v7

      - name: Run NOBSTests
        run: bash scripts/test-ios.sh
