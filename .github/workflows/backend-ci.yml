name: Backend CI

# Runner strategy, and why it is split this way:
#
# The `backend` job runs on the self-hosted Mac in the house. It costs nothing,
# it does not depend on GitHub's hosted-runner availability, and it is the
# check that actually gates a pull request.
#
# The `cross-platform` job is the Linux/macOS/Windows matrix that enforces the
# cross-platform contract in docs/AI_WORKFLOW.md. GitHub-hosted runners are
# free for public repositories, so this costs nothing -- but hosted jobs can
# stop being schedulable for reasons that have nothing to do with the code (an
# account-level Actions hold does it, and did in August 2026: every hosted job
# failed in ~2s with no runner assigned and no logs). A job that cannot be
# scheduled still reports a red X, which is noise nobody can act on, so this
# job runs on manual dispatch only.
#
# Run it from the Actions tab ("Run workflow") before merging anything that
# touches path handling, process APIs, or file encoding -- and to re-enable it
# automatically once hosted runners work again, add `pull_request:` back to the
# job's `if:` condition below.
#
# Net effect: a pull request is gated on a check that always runs and is always
# free, and full platform coverage is one button away.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Tests and lint (self-hosted Mac)
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - uses: actions/checkout@v7

      - name: Resolve Python
        run: |
          for candidate in \
            /opt/homebrew/bin/python3.13 \
            /opt/homebrew/bin/python3.12 \
            /opt/homebrew/bin/python3.11 \
            /opt/homebrew/bin/python3 \
            python3
          do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "Using $candidate"
              echo "PYTHON=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No Python 3.11+ interpreter found on the Mac runner." >&2
          exit 1

      - name: Set up NOBS
        run: "$PYTHON scripts/dev.py setup"

      - name: Test and lint
        run: "$PYTHON scripts/dev.py check"

  cross-platform:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    # Manual only: an unschedulable hosted job would otherwise post a red X on
    # every pull request that no code change can clear. See the note at the top.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
        include:
          # Guard the supported floor without tripling the whole matrix.
          - os: ubuntu-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up NOBS
        run: python scripts/dev.py setup

      - name: Test and lint
        run: python scripts/dev.py check

  ios-macos:
    name: NOBSTests on Mac runner
    runs-on: [self-hosted, macOS, ARM64]

    env:
      DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer

    steps:
      - uses: actions/checkout@v7

      - name: Run NOBSTests
        run: bash scripts/test-ios.sh
