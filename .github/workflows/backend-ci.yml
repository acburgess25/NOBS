name: Backend CI

# Runner strategy, and why it is split this way:
#
# The `backend` job is the check that gates a pull request, so the one thing it
# must never do is fail to run. It is portable Python -- the same
# `scripts/dev.py check` that passes on Linux, macOS, and Windows -- so it runs
# on `ubuntu-latest`, which is free for public repositories and is scheduled by
# GitHub rather than by whether a particular machine in the house is awake.
#
# It used to run on the self-hosted Mac, on the reasoning that a machine we own
# cannot be taken away by an account-level Actions hold. That traded one
# availability risk for another, and the second one arrived: with the `macbook`
# runner offline, the gating job queued instead of running, so no pull request
# could report green no matter what was in it. Ten of them accumulated. A check
# that hangs is worse than a check that fails, because nothing tells you it is
# not coming.
#
# The `cross-platform` job is the macOS/Windows matrix enforcing the
# cross-platform contract in docs/AI_WORKFLOW.md. Hosted jobs can stop being
# schedulable for reasons unrelated to the code (an account-level hold did it in
# August 2026: every hosted job failed in ~2s with no runner and no logs), and a
# job that cannot be scheduled reports a red X nobody can act on. So it stays on
# manual dispatch. Linux is covered on every pull request by `backend` above,
# including the 3.11 floor.
#
# The `ios-macos` job genuinely needs the self-hosted Mac -- it wants the Xcode
# 27 beta toolchain that hosted macOS images do not carry. Because that Mac is
# only intermittently online, it does not run on pull requests, where it would
# queue forever and reintroduce exactly the problem described above. It runs on
# pushes to main and on manual dispatch, when the Mac being asleep delays a
# result instead of blocking a merge.
#
# Net effect: every pull request is gated on a check that always runs, is always
# free, and can actually go green. Full platform coverage and the iOS tests are
# each one button away in the Actions tab.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Tests and lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the working version; 3.11 guards the `requires-python` floor.
        python-version: ["3.12", "3.11"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up NOBS
        run: python scripts/dev.py setup

      - name: Test and lint
        run: python scripts/dev.py check"

  cross-platform:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    # Manual only: an unschedulable hosted job would otherwise post a red X on
    # every pull request that no code change can clear. See the note at the top.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up NOBS
        run: python scripts/dev.py setup

      - name: Test and lint
        run: python scripts/dev.py check

  ios-macos:
    name: NOBSTests on Mac runner
    # Not on pull requests: this needs the self-hosted Mac, and when that Mac is
    # offline the job queues rather than failing, which is what stalled the
    # backlog. On main and on dispatch, a sleeping Mac delays a result instead
    # of blocking a merge.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS, ARM64]

    env:
      DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer

    steps:
      - uses: actions/checkout@v7

      - name: Run NOBSTests
        run: bash scripts/test-ios.sh
