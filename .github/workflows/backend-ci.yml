name: Backend CI

# Backend CI runs on GitHub-hosted runners so a pull request is never blocked
# by whether a particular machine in the house happens to be awake. The repo is
# public, so hosted minutes are free.
#
# The matrix is the cross-platform contract from docs/AI_WORKFLOW.md: shared
# backend code must pass on Linux, macOS, and Windows. Python 3.11 is the
# supported floor (pyproject requires-python = ">=3.11"), so it is exercised
# alongside the primary 3.12 interpreter.
#
# Only the iOS job stays on the self-hosted Mac: it needs the Xcode 27 beta
# toolchain, which hosted macOS images do not carry.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
        include:
          # Guard the supported floor without tripling the whole matrix.
          - os: ubuntu-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up NOBS
        run: python scripts/dev.py setup

      - name: Test and lint
        run: python scripts/dev.py check

  ios-macos:
    name: NOBSTests on Mac runner
    runs-on: [self-hosted, macOS, ARM64]

    env:
      DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer

    steps:
      - uses: actions/checkout@v7

      - name: Run NOBSTests
        run: bash scripts/test-ios.sh
