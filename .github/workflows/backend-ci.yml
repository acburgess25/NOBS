name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-linux:
    name: Python ${{ matrix.python-version }} on Tank
    runs-on: [self-hosted, tank]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: |
          if ! command -v "python${{ matrix.python-version }}" >/dev/null; then
            echo "python${{ matrix.python-version }} not found on Tank runner host" >&2
            exit 1
          fi
          echo "PYTHON=python${{ matrix.python-version }}" >> "$GITHUB_ENV"

      - name: Set up NOBS
        run: "$PYTHON scripts/dev.py setup"

      - name: Test and lint
        run: "$PYTHON scripts/dev.py check"

  backend-macos:
    name: Python ${{ matrix.python-version }} on Mac runner
    runs-on: [self-hosted, macOS, ARM64]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up NOBS
        run: /opt/homebrew/bin/python3.13 scripts/dev.py setup

      - name: Test and lint
        run: /opt/homebrew/bin/python3.13 scripts/dev.py check

  ios-macos:
    name: NOBSTests on Mac runner
    runs-on: [self-hosted, macOS, ARM64]
    env:
      DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4

      - name: Run NOBSTests
        run: bash scripts/test-ios.sh
