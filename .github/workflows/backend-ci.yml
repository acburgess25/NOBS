name: Backend CI

# Runner strategy, and why it is split this way:
#
# The `backend` job runs on the self-hosted Mac in the house. It costs nothing,
# it does not depend on GitHub's hosted-runner availability, and it is the
# check that actually gates a pull request.
#
# The `cross-platform` job is the Linux/macOS/Windows matrix that enforces the
# cross-platform contract in docs/AI_WORKFLOW.md. GitHub-hosted runners are
# free for public repositories, so this costs nothing either -- but hosted jobs
# can stop being schedulable for reasons that have nothing to do with the code
# (an account-level Actions hold does it, and did in August 2026: every hosted
# job failed in ~2s with no runner assigned and no logs). It is marked
# continue-on-error so that when that happens it cannot block a pull request or
# report a failure that no diff can fix. When hosted runners work, it gives the
# Windows and Linux coverage the Mac alone cannot.
#
# Net effect: a pull request is gated on a check that always runs and is always
# free, and gains extra platform coverage whenever GitHub can provide it.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Tests and lint (self-hosted Mac)
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - uses: actions/checkout@v7

      - name: Resolve Python
        run: |
          for candidate in \
            /opt/homebrew/bin/python3.13 \
            /opt/homebrew/bin/python3.12 \
            /opt/homebrew/bin/python3.11 \
            /opt/homebrew/bin/python3 \
            python3
          do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "Using $candidate"
              echo "PYTHON=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No Python 3.11+ interpreter found on the Mac runner." >&2
          exit 1

      - name: Set up NOBS
        run: "$PYTHON scripts/dev.py setup"

      - name: Test and lint
        run: "$PYTHON scripts/dev.py check"

  cross-platform:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Never blocks a pull request: see the runner strategy note at the top.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
        include:
          # Guard the supported floor without tripling the whole matrix.
          - os: ubuntu-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up NOBS
        run: python scripts/dev.py setup

      - name: Test and lint
        run: python scripts/dev.py check

  ios-macos:
    name: NOBSTests on Mac runner
    runs-on: [self-hosted, macOS, ARM64]

    env:
      DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer

    steps:
      - uses: actions/checkout@v7

      - name: Run NOBSTests
        run: bash scripts/test-ios.sh
