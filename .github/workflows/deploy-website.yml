# Deploy nobsdash.com (GitHub Pages)
#
# Runner: self-hosted Mac, not ubuntu-latest. See docs/CI_TROUBLESHOOTING.md
# "Every hosted job fails in seconds" -- GitHub-hosted runners can stop being
# schedulable for account-level reasons that have nothing to do with this
# repo (it happened in August 2026). Backend CI already moved its gating job
# to the self-hosted Mac for that reason. This workflow hadn't, which meant a
# hosted-runner outage left the live site -- including the support.json tip
# CTA -- stuck on a stale build with no code fix able to recover it. actions/
# setup-node and pnpm/action-setup install their own toolchains regardless of
# runner, so this only requires the Mac runner to be online and have network
# access, same as Backend CI already does.

name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install and build
        working-directory: website
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: [self-hosted, macOS, ARM64]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
