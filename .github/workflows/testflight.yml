name: TestFlight

# Self-hosted Mac runner (free). Register with scripts/setup-github-runner-mac.sh
# Secrets still required for App Store Connect upload:
#   ASC_API_KEY_ID, ASC_API_ISSUER_ID, ASC_API_KEY_CONTENT

on:
  push:
    branches: [main]
    paths:
      - "NOBS/**"
      - "NOBSWidgets/**"
      - "NOBS.xcodeproj/**"
      - "ExportOptions.plist"
      - ".github/workflows/testflight.yml"
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: true

jobs:
  upload:
    name: Archive & Upload
    runs-on: [self-hosted, macOS, ARM64, testflight]
    env:
      DEVELOPMENT_TEAM: K853LKQLAS
      DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer
      RUNNER_TOOL_CACHE: ${{ github.workspace }}/../_tool
      AGENT_TOOLSDIRECTORY: ${{ github.workspace }}/../_tool

    steps:
      - uses: actions/checkout@v4

      - name: Import distribution certificate
        env:
          P12_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          P12_BASE64: ${{ secrets.DIST_CERT_P12 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/ci-signing.keychain-db"
          security create-keychain -p "$P12_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$P12_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$P12_PASSWORD" -A \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$P12_PASSWORD" "$keychain"

      - name: Install App Store Connect API key
        env:
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/private_keys
          key=~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8
          if printf '%s' "$ASC_API_KEY_CONTENT" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s' "$ASC_API_KEY_CONTENT" > "$key"
          else
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "$key"
          fi

      - name: Ensure development and distribution certificates
        env:
          P12_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_PATH: ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/ci-signing.keychain-db"
          bash scripts/ci-ensure-signing-certs.sh "$keychain" "$P12_PASSWORD"

      - name: Archive & export
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/ci-signing.keychain-db"
          security unlock-keychain -p "${{ secrets.DIST_CERT_PASSWORD }}" "$keychain"
          security list-keychains -d user -s "$keychain"
          dist_identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Apple Distribution.*\)".*/\1/p' | head -1)"
          if [[ -z "$dist_identity" ]]; then
            echo "No Apple Distribution identity found in CI keychain" >&2
            exit 1
          fi
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/NOBS-*
          export_dir="${RUNNER_TEMP:-/tmp}/nobs-export"
          archive_path="${RUNNER_TEMP:-/tmp}/NOBS.xcarchive"
          auth=(
            -allowProvisioningUpdates
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8
            -authenticationKeyID ${{ secrets.ASC_API_KEY_ID }}
            -authenticationKeyIssuerID ${{ secrets.ASC_API_ISSUER_ID }}
          )
          xcodebuild archive \
            -project NOBS.xcodeproj \
            -scheme NOBS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            "${auth[@]}" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="$dist_identity" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM"
          xcodebuild -exportArchive \
            -archivePath "$archive_path" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$export_dir" \
            "${auth[@]}"
          echo "EXPORT_DIR=$export_dir" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$EXPORT_DIR/NOBS.ipa" \
            --apiKey ${{ secrets.ASC_API_KEY_ID }} \
            --apiIssuer ${{ secrets.ASC_API_ISSUER_ID }}

      - name: Clean up API key
        if: always()
        run: rm -f ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8
