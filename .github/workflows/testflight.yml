name: TestFlight

on:
  push:
    branches: [main]
    paths:
      - "NOBS/**"
      - "NOBS.xcodeproj/**"
      - "ExportOptions.plist"
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new in this build (shown in TestFlight)"
        required: false

# Only allow one upload at a time — cancels in-progress if a new commit lands.
concurrency:
  group: testflight
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Archive & Upload to TestFlight
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Write the App Store Connect API key to disk ────────────────────
      # Required GitHub secrets (Settings → Secrets → Actions):
      #   ASC_API_KEY_ID        — Key ID  (e.g. ABC1234567)
      #   ASC_API_ISSUER_ID     — Issuer ID (UUID from App Store Connect)
      #   ASC_API_KEY_CONTENT   — base64 of .p8:  base64 -i AuthKey_XXXX.p8 | tr -d '\n'
      #   DIST_CERT_P12         — base64 of Distribution cert: base64 -i cert.p12 | tr -d '\n'
      #   DIST_CERT_PASSWORD    — password you chose when exporting the .p12
      #   PROVISIONING_PROFILE  — base64 of App Store .mobileprovision:
      #                           base64 -i "NOBS AppStore.mobileprovision" | tr -d '\n'
      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_API_KEY_CONTENT" | base64 --decode \
            > ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8

      # ── 3. Import Distribution Certificate into a temporary keychain ──────
      - name: Import Distribution Certificate
        env:
          P12: ${{ secrets.DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > /tmp/dist_cert.p12
          security create-keychain -p "" ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p "" ci.keychain
          security import /tmp/dist_cert.p12 \
            -k ci.keychain \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "" ci.keychain
          rm /tmp/dist_cert.p12

      # ── 4. Install Provisioning Profile ───────────────────────────────────
      - name: Install Provisioning Profile
        env:
          PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          echo "$PROFILE" | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" \
            /dev/stdin <<< "$(security cms -D -i /tmp/profile.mobileprovision)")
          cp /tmp/profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/"$uuid".mobileprovision
          echo "PROVISIONING_PROFILE_UUID=$uuid" >> "$GITHUB_ENV"

      # ── 5. Show available Xcode versions ──────────────────────────────────
      - name: Show Xcode versions
        run: |
          ls /Applications/ | grep -i xcode || true
          xcode-select -p
          xcodebuild -version

      # ── 6. Archive (iOS device, no simulator) ─────────────────────────────
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project NOBS.xcodeproj \
            -scheme NOBS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/NOBS.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=K853LKQLAS \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_UUID" \
            2>&1 | tee /tmp/xcodebuild.log | xcpretty --color || \
          { echo "--- xcodebuild output ---"; cat /tmp/xcodebuild.log; exit 1; }

      # ── 7. Export .ipa ─────────────────────────────────────────────────────
      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NOBS.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            2>&1 | tee /tmp/export.log | xcpretty --color || \
          { echo "--- export output ---"; cat /tmp/export.log; exit 1; }

      # ── 8. Upload to TestFlight ────────────────────────────────────────────
      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/NOBS.ipa" \
            --apiKey ${{ secrets.ASC_API_KEY_ID }} \
            --apiIssuer ${{ secrets.ASC_API_ISSUER_ID }}

      # ── 9. Clean up ────────────────────────────────────────────────────────
      - name: Clean up secrets
        if: always()
        run: |
          rm -f ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8
          security delete-keychain ci.keychain 2>/dev/null || true

