name: TestFlight

# Secrets (Settings → Secrets → Actions):
#   ASC_API_KEY_ID, ASC_API_ISSUER_ID, ASC_API_KEY_CONTENT (.p8 contents, raw or base64)
#   DIST_CERT_P12 (base64), DIST_CERT_PASSWORD

on:
  push:
    branches: [main]
    paths:
      - "NOBS/**"
      - "NOBSWidgets/**"
      - "NOBS.xcodeproj/**"
      - "ExportOptions.plist"
      - ".github/workflows/testflight.yml"
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: true

jobs:
  upload:
    name: Archive & Upload
    runs-on: macos-latest
    env:
      DEVELOPMENT_TEAM: K853LKQLAS

    steps:
      - uses: actions/checkout@v4

      - uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.DIST_CERT_P12 }}
          p12-password: ${{ secrets.DIST_CERT_PASSWORD }}

      - name: Install App Store Connect API key
        env:
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/private_keys
          key=~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8
          if printf '%s' "$ASC_API_KEY_CONTENT" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s' "$ASC_API_KEY_CONTENT" > "$key"
          else
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "$key"
          fi

      - name: Archive & export
        run: |
          set -euo pipefail
          auth=(
            -allowProvisioningUpdates
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8
            -authenticationKeyID ${{ secrets.ASC_API_KEY_ID }}
            -authenticationKeyIssuerID ${{ secrets.ASC_API_ISSUER_ID }}
          )
          xcodebuild archive \
            -project NOBS.xcodeproj \
            -scheme NOBS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NOBS.xcarchive" \
            "${auth[@]}" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NOBS.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            "${auth[@]}"

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/NOBS.ipa" \
            --apiKey ${{ secrets.ASC_API_KEY_ID }} \
            --apiIssuer ${{ secrets.ASC_API_ISSUER_ID }}

      - name: Clean up API key
        if: always()
        run: rm -f ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8
