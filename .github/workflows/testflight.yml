name: TestFlight

# Self-hosted Mac runner (free). Register with scripts/setup-github-runner-mac.sh
# Required secrets (App Store Connect API only — no manual .p12 export):
#   ASC_API_KEY_ID, ASC_API_ISSUER_ID, ASC_API_KEY_CONTENT

on:
  push:
    branches: [main]
    paths:
      - "NOBS/**"
      - "NOBSWidgets/**"
      - "NOBS.xcodeproj/**"
      - "ExportOptions.plist"
  workflow_dispatch:
    inputs:
      refresh_signing_only:
        description: Only refresh App Store Connect signing (skip archive/upload)
        type: boolean
        default: false
      cleanup_apple_account:
        description: Remove non-NOBS certs, profiles, bundle IDs (destructive)
        type: boolean
        default: false
      upload_staged_ipa:
        description: Upload ~/nobs-build/NOBS.ipa only (skip build/signing)
        type: boolean
        default: false

concurrency:
  group: testflight
  cancel-in-progress: true

jobs:
  upload:
    name: Archive & Upload
    runs-on: [self-hosted, macOS, ARM64, testflight]
    env:
      DEVELOPMENT_TEAM: K853LKQLAS
      DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer
      RUNNER_TOOL_CACHE: ${{ github.workspace }}/../_tool
      AGENT_TOOLSDIRECTORY: ${{ github.workspace }}/../_tool
      CI_KEYCHAIN_PASSWORD: nobs-ci-signing

    steps:
      - uses: actions/checkout@v7
        if: ${{ !inputs.upload_staged_ipa }}

      - name: Create CI keychain
        if: ${{ !inputs.upload_staged_ipa }}
        run: |
          set -euo pipefail
          keychain="$HOME/.nobs-ci/signing.keychain-db"
          mkdir -p "$HOME/.nobs-ci"
          bash scripts/ci-prepare-keychain.sh "$keychain" "$CI_KEYCHAIN_PASSWORD"
          echo "CI_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        env:
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/private_keys
          key=~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8
          if printf '%s' "$ASC_API_KEY_CONTENT" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s' "$ASC_API_KEY_CONTENT" > "$key"
          else
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "$key"
          fi

      - name: Bootstrap signing tools
        if: ${{ !inputs.upload_staged_ipa }}
        run: |
          set -euo pipefail
          python3 -m pip install --user PyJWT cryptography httpx
          mkdir -p "$HOME/.local/share/fastlane/4.0.0"
          if [[ ! -f "$HOME/.local/share/fastlane/4.0.0/.bootstrapped" ]]; then
            cp -R /opt/homebrew/Cellar/fastlane/2.237.0/libexec/gems/* "$HOME/.local/share/fastlane/4.0.0/"
            touch "$HOME/.local/share/fastlane/4.0.0/.bootstrapped"
          fi

      - name: Clean up non-NOBS Apple Developer assets
        if: ${{ inputs.cleanup_apple_account }}
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          export ASC_API_KEY_PATH="$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          python3 scripts/ci-cleanup-apple-account.py --execute
          python3 scripts/ci-enable-bundle-capabilities.py || echo "Capability enablement skipped (check Developer portal)"

      - name: Provision signing certificates via API
        if: ${{ !inputs.upload_staged_ipa }}
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          export ASC_API_KEY_PATH="$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          bash scripts/ci-ensure-signing-certs.sh "$CI_KEYCHAIN" "$CI_KEYCHAIN_PASSWORD"

      - name: Refresh provisioning profiles
        if: ${{ !inputs.upload_staged_ipa }}
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          export ASC_API_KEY_PATH="$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          python3 scripts/validate-asc-api.py
          python3 scripts/ci-enable-bundle-capabilities.py || echo "Capability enablement skipped (check Developer portal)"
          bash scripts/ci-refresh-provisioning-profiles.sh

      - name: Archive & export
        if: ${{ !inputs.refresh_signing_only && !inputs.upload_staged_ipa }}
        run: |
          set -euo pipefail
          security unlock-keychain -p "$CI_KEYCHAIN_PASSWORD" "$CI_KEYCHAIN"
          security list-keychains -d user -s "$CI_KEYCHAIN" login.keychain-db
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/NOBS-*
          export_dir="${RUNNER_TEMP:-/tmp}/nobs-export"
          archive_path="${RUNNER_TEMP:-/tmp}/NOBS.xcarchive"
          auth=(
            -allowProvisioningUpdates
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8
            -authenticationKeyID ${{ secrets.ASC_API_KEY_ID }}
            -authenticationKeyIssuerID ${{ secrets.ASC_API_ISSUER_ID }}
          )
          xcodebuild archive \
            -project NOBS.xcodeproj \
            -scheme NOBS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            "${auth[@]}" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM"
          xcodebuild -exportArchive \
            -archivePath "$archive_path" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$export_dir" \
            "${auth[@]}"
          echo "EXPORT_DIR=$export_dir" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        if: ${{ !inputs.refresh_signing_only }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.upload_staged_ipa }}" = "true" ]; then
            ipa="$HOME/nobs-build/NOBS.ipa"
          else
            ipa="$EXPORT_DIR/NOBS.ipa"
          fi
          test -f "$ipa"
          xcrun altool --upload-app \
            --type ios \
            --file "$ipa" \
            --apiKey ${{ secrets.ASC_API_KEY_ID }} \
            --apiIssuer ${{ secrets.ASC_API_ISSUER_ID }}

      - name: Clean up API key
        if: always()
        run: rm -f ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8
