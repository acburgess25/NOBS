[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nobs-tank-api"
version = "0.1.0"
description = "Privacy-first backend services for NOBS."
requires-python = ">=3.11"
dependencies = [
  "ddgs>=9.0,<10",
  "fastapi>=0.115,<1",
  "feedparser>=6.0,<7",
  "httpx>=0.28,<1",
  "psutil>=6.0,<8",
  "pydantic-settings>=2.7,<3",
  "trafilatura>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "wikipedia-api>=0.7,<1",
  "zeroconf>=0.147,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "qrcode>=7.4,<9",
  "ruff>=0.16,<0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Declare the rule set explicitly. Without a `select`, the enforced rules are
# whatever ruff ships as its default, and that default changes between
# releases -- 0.16 expanded it from roughly 20 rules to 413, which turned an
# ordinary Dependabot bump into 61 new CI failures. Pinning the selection
# means a ruff upgrade no longer silently changes what CI enforces.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "FURB", "EXE", "RUF"]
ignore = [
  # `str, Enum` members serialize as their value; `StrEnum` changes `str()`
  # output. These enums cross the API boundary, so migrating them would be a
  # wire-format change, not a lint cleanup.
  "UP042",
  # The en dashes and curly quotes are deliberate typography in user-facing
  # copy and comments, not typos.
  "RUF001",
  "RUF003",
  # scripts/dev.py deliberately checks the interpreter version at runtime so a
  # user on an unsupported Python gets a clear message. ruff assumes the floor
  # from target-version and calls the guard dead code; it is not.
  "UP036",
]
