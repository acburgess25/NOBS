<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="NOBS logo">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="1" stop-color="#00CEC9"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </radialGradient>
  </defs>
  <!-- rounded-square base -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#grad)"/>
  <!-- neural "brain" core -->
  <circle cx="60" cy="58" r="34" fill="url(#core)"/>
  <circle cx="60" cy="58" r="34" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1.5"/>
  <!-- synapse nodes + links (local + one cloud fallback) -->
  <g stroke="#fff" stroke-width="3" fill="#fff" opacity="0.9">
    <line x1="48" y1="44" x2="62" y2="52"/>
    <line x1="72" y1="44" x2="62" y2="52"/>
    <line x1="48" y1="44" x2="72" y2="44"/>
    <circle cx="48" cy="44" r="5"/>
    <circle cx="72" cy="44" r="5"/>
    <circle cx="62" cy="52" r="4"/>
    <line x1="62" y1="52" x2="52" y2="66"/>
    <line x1="62" y1="52" x2="72" y2="66"/>
    <circle cx="52" cy="66" r="4"/>
    <circle cx="72" cy="66" r="4"/>
    <line x1="52" y1="66" x2="45" y2="78"/>
    <circle cx="45" cy="78" r="5"/>
    <line x1="72" y1="66" x2="78" y2="76"/>
    <circle cx="78" cy="76" r="4"/>
  </g>
  <!-- node status dot (pulsing local brain) -->
  <circle cx="90" cy="30" r="7" fill="#fff"/>
  <circle cx="90" cy="30" r="3" fill="#6C5CE7"/>
</svg>